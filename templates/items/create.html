{% extends 'base.html' %}

{% block title %}Новая заметка | SQLite CRUD{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card custom-card">
            <div class="card-header card-header-gradient py-3">
                <h4 class="mb-0 fw-bold text-primary">
                    <i class="bi bi-plus-circle me-2"></i>Создание новой заметки
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('main.note_create') }}">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Заголовок заметки <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" required placeholder="Например: План на сессию" value="{{ title or '' }}">
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label fw-semibold">Категория</label>
                        <input type="text" class="form-control" id="category" name="category" list="categoryList" placeholder="Учёба, Разработка, Личное..." value="{{ category or 'Общее' }}">
                        <datalist id="categoryList">
                            <option value="Учёба">
                            <option value="Разработка">
                            <option value="Базы данных">
                            <option value="Общее">
                            <option value="Планы">
                        </datalist>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label fw-semibold">Текст заметки <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="content" name="content" rows="6" required placeholder="Введите подробный текст заметки...">{{ content or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('main.notes_list') }}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i>Сохранить заметку
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
