{% extends 'base.html' %}

{% block title %}Редактирование заметки #{{ note['id'] }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card custom-card">
            <div class="card-header card-header-gradient py-3">
                <h4 class="mb-0 fw-bold text-primary">
                    <i class="bi bi-pencil-square me-2"></i>Редактирование заметки #{{ note['id'] }}
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('main.note_edit', note_id=note['id']) }}">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Заголовок заметки <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" required value="{{ note['title'] }}">
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label fw-semibold">Категория</label>
                        <input type="text" class="form-control" id="category" name="category" list="categoryList" value="{{ note['category'] }}">
                        <datalist id="categoryList">
                            <option value="Учёба">
                            <option value="Разработка">
                            <option value="Базы данных">
                            <option value="Общее">
                            <option value="Планы">
                        </datalist>
                    </div>

                    <div class="mb-4">
                        <label for="content" class="form-label fw-semibold">Текст заметки <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="content" name="content" rows="6" required>{{ note['content'] }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('main.note_detail', note_id=note['id']) }}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-warning text-dark px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i>Обновить заметку
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
